<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Carnavales Chajarí</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: #fff;
            padding: 1.5rem;
            text-align: center;
        }

        .card {
            max-width: 380px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2.5rem 1.75rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }

        button {
            background: #fff;
            color: #ec4899;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="emoji">📡</div>
        <h1>Sin conexión</h1>
        <p>No pudimos conectarnos a internet. Revisá tu red y volvé a intentar.</p>
        <button onclick="window.location.reload()">Reintentar</button>
    </div>
</body>

</html>
